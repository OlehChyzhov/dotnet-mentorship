name: Build and Deploy

on:
  workflow_dispatch:
  
  pull_request:
    branches: [ "master" ]
    types: ["closed"]

jobs:
  build-backend-and-run-tests:
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: "10.0.x"

    - name: Restore Dependencies
      run: dotnet restore Airbnb.API/Airbnb.API.csproj

    - name: Build Backend
      run: dotnet build Airbnb.API/Airbnb.API.csproj --configuration Release

    - name: Test Backend
      run: dotnet test Airbnb.Tests/Airbnb.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

    - name: Publish Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: TestResults/*.trx
        reporter: dotnet-trx

  push-docker-image-and-deploy:
    runs-on: ubuntu-latest
    needs: build-backend-and-run-tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Docker
      uses: docker/setup-buildx-action@v3

    - name: Log into Docker Hub
      uses: docker/login-action@v3
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build the Docker image
      run: docker build -f Airbnb.API/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/airbnb-api:latest .
    
    - name: Push the Docker image
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/airbnb-api:latest

    - name: Login to AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1

    - name: Update the Container on AWS
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: .aws/task-definition.json
        container-name: airbnb-api
        image: ${{ secrets.DOCKERHUB_USERNAME }}/airbnb-api:latest

    - name: Force Redeploy
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: dotnet-mentorship-api
        cluster: dotnet-mentorship-cluster
        wait-for-service-stability: true
