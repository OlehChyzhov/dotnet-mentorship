services:
  # RabbitMQ
  airbnb.broker.rabbitmq:
    container_name: "airbnb.broker.rabbitmq"
    image: rabbitmq:4.0-management
    ports:
      - "2100:5672"  # Producers/Consumers
      - "2101:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - "rabbitmq_data:/var/lib/rabbitmq"
  
  # Application
  airbnb.sqlserver:
    container_name: "airbnb.sqlserver"
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports:
      - "2000:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - "mssql_data:/var/opt/mssql"

  airbnb.api:
    container_name: "airbnb.api"
    build:
      context: "./Application/"
      dockerfile: "Airbnb.API/Dockerfile"
    ports:
      - "3000:8080"
    environment:
      JWT__Key: ${JWT_KEY}
      JWT__Issuer: ${JWT_ISSUER}
      JWT__Audience: ${JWT_Audience}
      JWT__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES}
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      DefaultUserOptions__DefaultPassword: ${DEFAULT_USER_PASSWORD}
    depends_on:
      - airbnb.sqlserver
      - airbnb.broker.rabbitmq
    
    
  # Audit
  airbnb.audit.mongodb:
    container_name: "airbnb.audit.mongodb"
    image: mongo:8.0.4
    ports:
      - "2001:27017"
    environment:
      MONGO_INITDB_DATABASE: airbnb-audit-db
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    volumes:
      - "mongodb_data:/data/db"
    restart: unless-stopped
      
  airbnb.audit.api:
    container_name: "airbnb.audit.api"
    build:
      context: "./Audit/"
      dockerfile: "Airbnb.Audit.API/Dockerfile"
    ports:
      - "3001:8080"
    depends_on:
      - airbnb.audit.mongodb
      - airbnb.broker.rabbitmq
    
  
volumes:
  rabbitmq_data:
  mssql_data:
  mongodb_data: