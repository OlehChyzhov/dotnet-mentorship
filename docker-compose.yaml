services:
  # RabbitMQ
  airbnb.broker.rabbitmq:
    container_name: "airbnb.broker.rabbitmq"
    image: rabbitmq:4.0-management
    ports:
      - "2100:5672"  # Producers/Consumers
      - "2101:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - "rabbitmq_data:/var/lib/rabbitmq"
  
  # Databases
  airbnb.sqlserver:
    container_name: "airbnb.sqlserver"
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports:
      - "2000:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${APPLICATION_MSSQL_SA_PASSWORD}
    volumes:
      - "mssql_data:/var/opt/mssql"
    
  airbnb.audit.mongodb:
    container_name: "airbnb.audit.mongodb"
    image: mongo:8.0.4
    ports:
      - "2001:27017"
    environment:
      MONGO_INITDB_DATABASE: airbnb-audit-db
      MONGO_INITDB_ROOT_USERNAME: ${AUDIT_MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${AUDIT_MONGODB_PASSWORD}
    volumes:
      - "mongodb_data:/data/db"
    restart: unless-stopped
    
  # API Gateway
  airbnb.gateway:
    container_name: "airbnb.gateway"
    build:
      context: "."
      dockerfile: "Airbnb.Gateway/Dockerfile"
    ports:
      - "3100:8080"
    environment:
      ElasticConfigurations__Uri: ${LOGGING_ELASTICSEARCH_URI}
    depends_on:
      airbnb.sqlserver:
        condition: service_started
      airbnb.audit.mongodb:
        condition: service_started
      airbnb.broker.rabbitmq:
        condition: service_healthy
    
  # Monolith
  airbnb.api.first:
    container_name: "airbnb.api.first"
    build:
      context: "."
      dockerfile: "Monolith/Airbnb.API/Dockerfile"
    ports:
      - "3101:8080"
    environment:
      ElasticConfigurations__Uri: ${LOGGING_ELASTICSEARCH_URI}
      JWT__Key: ${APPLICATION_JWT_KEY}
      JWT__Issuer: ${APPLICATION_JWT_ISSUER}
      JWT__Audience: ${APPLICATION_JWT_Audience}
      JWT__ExpirationMinutes: ${APPLICATION_JWT_EXPIRATION_MINUTES}
      ConnectionStrings__DefaultConnection: ${APPLICATION_DB_CONNECTION_STRING}
      DefaultUserOptions__DefaultPassword: ${APPLICATION_DEFAULT_USER_PASSWORD}
      
      RabbitMq__HostUri: ${RABBITMQ_HOST_URI}
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      airbnb.sqlserver:
        condition: service_started
      airbnb.broker.rabbitmq:
        condition: service_healthy
    
  airbnb.api.second:
    container_name: "airbnb.api.second"
    build:
      context: "."
      dockerfile: "Monolith/Airbnb.API/Dockerfile"
    ports:
      - "3102:8080"
    environment:
      ElasticConfigurations__Uri: ${LOGGING_ELASTICSEARCH_URI}
      JWT__Key: ${APPLICATION_JWT_KEY}
      JWT__Issuer: ${APPLICATION_JWT_ISSUER}
      JWT__Audience: ${APPLICATION_JWT_Audience}
      JWT__ExpirationMinutes: ${APPLICATION_JWT_EXPIRATION_MINUTES}
      ConnectionStrings__DefaultConnection: ${APPLICATION_DB_CONNECTION_STRING}
      DefaultUserOptions__DefaultPassword: ${APPLICATION_DEFAULT_USER_PASSWORD}

      RabbitMq__HostUri: ${RABBITMQ_HOST_URI}
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      airbnb.sqlserver:
        condition: service_started
      airbnb.broker.rabbitmq:
        condition: service_healthy
    
  airbnb.api.third:
    container_name: "airbnb.api.third"
    build:
      context: "."
      dockerfile: "Monolith/Airbnb.API/Dockerfile"
    ports:
      - "3103:8080"
    environment:
      ElasticConfigurations__Uri: ${LOGGING_ELASTICSEARCH_URI}
      JWT__Key: ${APPLICATION_JWT_KEY}
      JWT__Issuer: ${APPLICATION_JWT_ISSUER}
      JWT__Audience: ${APPLICATION_JWT_Audience}
      JWT__ExpirationMinutes: ${APPLICATION_JWT_EXPIRATION_MINUTES}
      ConnectionStrings__DefaultConnection: ${APPLICATION_DB_CONNECTION_STRING}
      DefaultUserOptions__DefaultPassword: ${APPLICATION_DEFAULT_USER_PASSWORD}

      RabbitMq__HostUri: ${RABBITMQ_HOST_URI}
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      airbnb.sqlserver:
        condition: service_started
      airbnb.broker.rabbitmq:
        condition: service_healthy
    
  # Audit Microservice
  airbnb.audit.api.first:
    container_name: "airbnb.audit.api.first"
    build:
      context: "."
      dockerfile: "Audit/Airbnb.Audit.API/Dockerfile"
    ports:
      - "3201:8080"
    environment:
      ElasticConfigurations__Uri: ${LOGGING_ELASTICSEARCH_URI}
      ConnectionStrings__MongoDB: ${AUDIT_MONGODB_DB_CONNECTION_STRING}
      
      RabbitMq__HostUri: ${RABBITMQ_HOST_URI}
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      airbnb.audit.mongodb:
        condition: service_started
      airbnb.broker.rabbitmq:
        condition: service_healthy
        
  airbnb.audit.api.second:
    container_name: "airbnb.audit.api.second"
    build:
      context: "."
      dockerfile: "Audit/Airbnb.Audit.API/Dockerfile"
    ports:
      - "3202:8080"
    environment:
      ElasticConfigurations__Uri: ${LOGGING_ELASTICSEARCH_URI}
      ConnectionStrings__MongoDB: ${AUDIT_MONGODB_DB_CONNECTION_STRING}

      RabbitMq__HostUri: ${RABBITMQ_HOST_URI}
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      airbnb.audit.mongodb:
        condition: service_started
      airbnb.broker.rabbitmq:
        condition: service_healthy
  
  airbnb.audit.api.third:
    container_name: "airbnb.audit.third"
    build:
      context: "."
      dockerfile: "Audit/Airbnb.Audit.API/Dockerfile"
    ports:
      - "3203:8080"
    environment:
      ElasticConfigurations__Uri: ${LOGGING_ELASTICSEARCH_URI}
      ConnectionStrings__MongoDB: ${AUDIT_MONGODB_DB_CONNECTION_STRING}

      RabbitMq__HostUri: ${RABBITMQ_HOST_URI}
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      airbnb.audit.mongodb:
        condition: service_started
      airbnb.broker.rabbitmq:
        condition: service_healthy
        
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: ${LOGGING_ELASTICSEARCH_URI}
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "4000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    
  
volumes:
  rabbitmq_data:
  mssql_data:
  mongodb_data:
  elasticsearch-data:
  prometheus-data:
  grafana-data: